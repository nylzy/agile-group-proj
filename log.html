<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitScore - Log Exercise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4">
        <span class="navbar-brand">FitScore</span>
        <div class="navbar-links">
            <a href="home.html" class="navbar-link">Home</a>
            <a href="log.html" class="navbar-link">Log Exercise</a>
            <a href="leaderboard.html" class="navbar-link">Leaderboard</a>
            <a href="profile.html" class="navbar-profile-button">
                <img src="generic_profile_pic.png" alt="Profile Picture" class="profile-pic">
            </a>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container py-5">
        <h1 class="display-4 fw-bold">Log Exercise</h1>
        <p class="lead" style="color: #aaa;">Record a training session and update your FitScore.</p>
    </div>

    <!-- Sport Selector -->
    <div class="container pb-4">
        <p class="log-select-label">Select a sport to get started</p>
        <div class="lb-filters">
            <button class="lb-filter-btn" data-sport="lifting">Lifting</button>
            <button class="lb-filter-btn" data-sport="running">Running</button>
            <button class="lb-filter-btn" data-sport="swimming">Swimming</button>
            <button class="lb-filter-btn" data-sport="cycling">Cycling</button>
            <button class="lb-filter-btn" data-sport="yoga">Yoga / Pilates</button>
            <button class="lb-filter-btn" data-sport="plyometrics">Plyometrics</button>
            <button class="lb-filter-btn" data-sport="martial-arts">Martial Arts</button>
            <button class="lb-filter-btn" data-sport="climbing">Climbing</button>
            <button class="lb-filter-btn" data-sport="hiking">Hiking</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
