<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitScore - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login-reg-styles.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4">
        <a href="{{ url_for('index') }}" class="navbar-brand">FitScore</span>
        <a href="{{ url_for('login') }}" class="btn btn-primary">Log In</a>
    </nav>

    <!-- Main Content -->
    <div class="container d-flex flex-grow-1 py-5">
        <div class="page-wrapper">
            <p class="login-subtitle">Please enter your details</p>
            <h1 class="login-title">Welcome back!</h1>

            <!-- Login Form -->
            <form action="/login" id="loginform">
                <!-- Username -->
                <div class="form-group">
                    <label for="user"><b>Username</b></label>
                    <input type="text" id="user" name="username" placeholder="Username" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password"><b>Password</b></label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="remember-forgot">
                    <label for="remember" class="remember-label">Remember me
                    <input type="checkbox" id="remember" name="remember" value="true">
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit -->
                <a href="{{ url_for('home') }}" class="loginpage-btn-login">Log In</a>

                <!--Register Link-->
                <p class="register-text"><b>Don't have an account?</b> <a href="{{ url_for('register') }}">Sign up</a></p>
            </form>
        </div>
    </div>
</body>
</html>
