<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitScore - Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4">
        <a href="{{ url_for('index') }}" class="navbar-brand">FitScore</span>
        <a href="{{ url_for('login') }}" class="btn btn-primary">Log In</a>
    </nav>

    <!-- Main Content -->
    <div class="container d-flex flex-grow-1 py-5">
        <div class="page-wrapper">
            <h1 class="title">Welcome to FitScore!</h1>
            <p class="subtitle">It's time to begin your journey with us.</p>

            <!-- Step Indicator -->
            <p class="text">Step <span id="step-number">1</span> of 3</p>

            <!-- Form -->
            <form action="/register" id="signupform">

                <!-- Step 1 -->
                <div class="step active">
                    <div class="form-group">
                        <label for="username"><b>Username</b></label>
                        <input type="text" id="username" placeholder="Username" required>
                    </div>
                </div>

                <!-- Step 2 -->
                <div class="step">
                    <div class="form-group">
                        <label for="email"><b>E-mail</b></label>
                        <input type="email" id="email" placeholder="E-mail" required>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="step">
                    <div class="form-group">
                        <label for="password"><b>Password</b></label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between">
                    <button type="button" id="back-btn" class="btn btn-secondary">Back</button>
                    <button type="button" id="next-btn" class="btn btn-primary">Next</button>
                    <button type="button" id="submit-btn" class="btn btn-submit">Submit</button>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
