<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitScore - Log Exercise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4">
        <span class="navbar-brand">FitScore</span>
        <div class="navbar-links">
            <a href="{{ url_for('home') }}" class="navbar-link">Home</a>
            <a href="{{ url_for('social') }}" class="navbar-link">Social</a>
            <a href="{{ url_for('log') }}" class="navbar-link">Log Exercise</a>
            <a href="{{ url_for('leaderboard') }}" class="navbar-link">Leaderboard</a>
            <a href="{{ url_for('profile') }}" class="navbar-profile-button">
                <img src="{{ url_for('static', filename='images/generic_profile_pic.png') }}" alt="Profile Picture" class="profile-pic">
            </a>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container py-5">
        <h1 class="display-4 fw-bold">Log Exercise</h1>
        <p class="lead" style="color: #aaa;">Record a training session and update your FitScore.</p>
    </div>

    <!-- Sport Selector -->
    <div class="container pb-4">
        <p class="log-select-label">Select a sport to get started</p>
        <div class="lb-filters">
            <button class="lb-filter-btn" data-sport="lifting">Lifting</button>
            <button class="lb-filter-btn" data-sport="running">Running</button>
            <button class="lb-filter-btn" data-sport="swimming">Swimming</button>
            <button class="lb-filter-btn" data-sport="cycling">Cycling</button>
            <button class="lb-filter-btn" data-sport="plyometrics">Plyometrics</button>
        </div>
    </div>

    <!-- SPORT-SPECIFIC FORM SECTIONS
         All hidden by default — JS reveals the correct
         one when the user picks a sport above. -->
         
    <div class="container pb-5">

        <!-- LIFTING -->
        <div class="log-sport-form" data-sport="lifting" hidden>
            <div class="log-form-card">
                <h4 class="log-form-title">Lifting</h4>

                <!-- Exercise block — more can be added dynamically via JS -->
                <div id="lifting-exercises">
                    <div class="lifting-exercise-block">
                        <div class="form-group">
                            <label>Exercise</label>
                            <select class="log-select">
                                <option value="" disabled selected>Choose an exercise</option>
                                <optgroup label="Compound">
                                    <option>Squat</option>
                                    <option>Bench Press</option>
                                    <option>Deadlift</option>
                                    <option>Overhead Press</option>
                                    <option>Barbell Row</option>
                                    <option>Pull-up / Chin-up</option>
                                </optgroup>
                                <optgroup label="Isolation">
                                    <option>Bicep Curl</option>
                                    <option>Tricep Pushdown</option>
                                    <option>Lateral Raise</option>
                                    <option>Leg Press</option>
                                    <option>Leg Curl</option>
                                    <option>Calf Raise</option>
                                </optgroup>
                            </select>
                        </div>

                        <!-- Set rows table -->
                        <table class="lifting-sets-table">
                            <thead>
                                <tr>
                                    <th>Set</th>
                                    <th>Weight (kg)</th>
                                    <th>Reps</th>
                                    <th>Done</th>
                                </tr>
                            </thead>
                            <tbody class="lifting-sets-body">
                                <tr>
                                    <td>1</td>
                                    <td><input type="number" class="log-input-sm" placeholder="0" min="0"></td>
                                    <td><input type="number" class="log-input-sm" placeholder="0" min="0"></td>
                                    <td><input type="checkbox"></td>
                                </tr>
                            </tbody>
                        </table>
                        <button type="button" class="log-btn-secondary add-set-btn">+ Add Set</button>
                    </div>
                </div>

                <button type="button" class="log-btn-secondary" id="add-exercise-btn">+ Add Exercise</button>
            </div>
        </div>

        <!-- RUNNING -->
        <div class="log-sport-form" data-sport="running" hidden>
            <div class="log-form-card">
                <h4 class="log-form-title">Running</h4>

                <div class="log-form-grid">
                    <div class="form-group">
                        <label for="run-distance">Distance</label>
                        <select id="run-distance" class="log-select">
                            <option value="" disabled selected>Select distance</option>
                            <option value="0.4">400m</option>
                            <option value="5">5K</option>
                            <option value="10">10K</option>
                            <option value="21.0975">Half Marathon</option>
                            <option value="42.195">Marathon</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="run-duration">Duration (min)</label>
                        <input type="number" id="run-duration" class="log-input" placeholder="0" min="0">
                    </div>
                    <div class="form-group">
                        <label>Avg Pace</label>
                        <input type="text" id="run-pace" class="log-input" placeholder="— min/km" readonly>
                    </div>
                </div>

                <button type="submit" class="btn-submit log-submit-btn" style="margin-top: 1.5rem;">Save Session</button>
            </div>
        </div>

        <!-- SWIMMING -->
        <div class="log-sport-form" data-sport="swimming" hidden>
            <div class="log-form-card">
                <h4 class="log-form-title">Swimming</h4>
                <div class="log-form-grid">
                    <div class="form-group">
                        <label for="swim-pool">Pool Length</label>
                        <select id="swim-pool" class="log-select">
                            <option value="" disabled selected>Select pool</option>
                            <option>25m</option>
                            <option>50m</option>
                            <option>Open Water</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="swim-distance">Distance (metres)</label>
                        <input type="number" id="swim-distance" class="log-input" placeholder="0" min="0">
                    </div>
                    <div class="form-group">
                        <label for="swim-stroke">Stroke</label>
                        <select id="swim-stroke" class="log-select">
                            <option value="" disabled selected>Select stroke</option>
                            <option>Freestyle</option>
                            <option>Backstroke</option>
                            <option>Breaststroke</option>
                            <option>Butterfly</option>
                            <option>Mixed</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- CYCLING -->
        <div class="log-sport-form" data-sport="cycling" hidden>
            <div class="log-form-card">
                <h4 class="log-form-title">Cycling</h4>
                <div class="log-form-grid">
                    <div class="form-group">
                        <label for="cycle-distance">Distance (km)</label>
                        <input type="number" id="cycle-distance" class="log-input" placeholder="0.0" min="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="cycle-elevation">Elevation Gain (m) <span class="log-optional">optional</span></label>
                        <input type="number" id="cycle-elevation" class="log-input" placeholder="0" min="0">
                    </div>
                    <div class="form-group">
                        <label for="cycle-type">Ride Type</label>
                        <select id="cycle-type" class="log-select">
                            <option value="" disabled selected>Select type</option>
                            <option>Road</option>
                            <option>Mountain</option>
                            <option>Indoor (stationary)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- PLYOMETRICS -->
        <div class="log-sport-form" data-sport="plyometrics" hidden>
            <div class="log-form-card">
                <h4 class="log-form-title">Plyometrics &amp; Sprints</h4>
                <div class="log-form-grid">
                    <div class="form-group">
                        <label for="plyo-focus">Focus</label>
                        <select id="plyo-focus" class="log-select">
                            <option value="" disabled selected>Select focus</option>
                            <option>Sprints</option>
                            <option>Box Jumps</option>
                            <option>Burpees</option>
                            <option>Mixed Circuit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="plyo-rounds">Rounds</label>
                        <input type="number" id="plyo-rounds" class="log-input" placeholder="0" min="0">
                    </div>
                    <div class="form-group">
                        <label for="plyo-rest">Rest Between Rounds (sec)</label>
                        <input type="number" id="plyo-rest" class="log-input" placeholder="60" min="0">
                    </div>
                </div>
            </div>
        </div>

    </div><!-- end container -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='log.js') }}"></script>


</body>
</html>
