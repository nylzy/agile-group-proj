<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitScore - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4">
        <a href="index.html" class="navbar-brand">FitScore</span>
        <a href="login.html" class="btn btn-primary">Log In</a>
    </nav>

    <!-- Main Content -->
    <div class="page-wrapper">
        <header>
            <h1>Welcome back to FitScore!</h1>
        </header>

        <!-- Login Form -->
        <div class="login-container">
            <form action="/login" method="post">

                <!-- Username -->
                <div class="form-group">
                    <label for="user"><b>Username</b></label>
                    <input type="text" id="user" name="username" placeholder="Username" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password"><b>Password</b></label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>

                <!-- Remember Me -->
                <div class="form-group remember-group">
                    <label for="remember">Remember me</label>
                    <input type="checkbox" id="remember" name="remember" value="true">
                </div>

                <!-- Submit -->
                <a href="home.html" class="btn btn-primary">Log In</a>

                <!--Register Link-->
                <p class="lead text"><b>Don't have an account?</b>   <a href="register.html">Sign up</a></p>
            </form>
        </div>

    </div>
</body>
</html>
